  <!-- Camera detail: last snapshot (taken on open) + rename + open live view. -->
  <dialog id="cameraDialog" class="detail-dialog">
    <div class="detail-card">
      <div class="detail-header">
        <h2 tabindex="-1" autofocus id="cameraDetailName">Camera</h2>
        <button id="cameraDetailClose" type="button" class="icon-button detail-close" aria-label="Close"><svg class="icon" aria-hidden="true"><use href="#i-x"></use></svg></button>
      </div>
      <img id="cameraSnapshot" class="camera-snapshot" alt="Camera snapshot">
      <div id="cameraSnapshotEmpty" class="camera-snapshot-empty" hidden>
        <svg class="icon" aria-hidden="true"><use href="#i-camera"></use></svg>
        <span>Snapshot unavailable</span>
      </div>
      <div class="row"><span>Model</span><span id="cameraDetailStatus" class="muted">—</span></div>
      <label class="row">
        <span>Display name</span>
        <input id="cameraDisplayName" type="text" class="input-native" placeholder="Custom label…">
      </label>
      <!-- Live view is a secondary verb in the body; Save is the footer's one
           primary (J-02 of #872, #882). -->
      <button id="cameraLiveBtn" type="button" class="button-tint camera-live-open">
        <svg class="icon" aria-hidden="true"><use href="#i-video"></use></svg> Open live view
      </button>
      <div class="detail-actions">
        <button id="cameraSave" type="button" class="button-primary detail-save-btn" disabled>Save</button>
      </div>
    </div>
  </dialog>

  <!-- Full-screen live view: MJPEG stream + PTZ d-pad + snapshot + record. -->
  <dialog id="cameraLiveDialog" class="detail-dialog camera-live-dialog">
    <div class="detail-card camera-live-card">
      <div class="detail-header">
        <h2 tabindex="-1" autofocus id="cameraLiveName">Camera</h2>
        <button id="cameraLiveClose" type="button" class="icon-button detail-close" aria-label="Close"><svg class="icon" aria-hidden="true"><use href="#i-x"></use></svg></button>
      </div>
      <div class="camera-live-stage">
        <img id="cameraLiveImg" class="camera-live-img" alt="Live camera view">
      </div>
      <div class="camera-live-controls">
        <div class="camera-dpad" role="group" aria-label="Pan and tilt">
          <button id="cameraPtzUp" type="button" class="icon-button camera-ptz-btn ptz-up" aria-label="Tilt up"><svg class="icon" aria-hidden="true"><use href="#i-chevron-right"></use></svg></button>
          <button id="cameraPtzLeft" type="button" class="icon-button camera-ptz-btn ptz-left" aria-label="Pan left"><svg class="icon" aria-hidden="true"><use href="#i-chevron-right"></use></svg></button>
          <button id="cameraPtzRight" type="button" class="icon-button camera-ptz-btn ptz-right" aria-label="Pan right"><svg class="icon" aria-hidden="true"><use href="#i-chevron-right"></use></svg></button>
          <button id="cameraPtzDown" type="button" class="icon-button camera-ptz-btn ptz-down" aria-label="Tilt down"><svg class="icon" aria-hidden="true"><use href="#i-chevron-right"></use></svg></button>
        </div>
        <!-- Every action carries a visible word (#805): the bare −/+ and glyph-only
             screenshot/record buttons named nothing on screen. Movement controls sit
             beside the pad; the capture actions get their own row so no label wraps
             or clips at phone width (#859). -->
        <div class="camera-live-side">
          <div id="cameraPtzMode" class="segmented camera-mode" role="group" aria-label="Pan and tilt mode" data-track="camera.ptz-mode">
            <button type="button" class="segmented-item" aria-pressed="true" data-ptz-mode="step" title="One click = one step (precise)">Step</button>
            <button type="button" class="segmented-item" aria-pressed="false" data-ptz-mode="hold" title="Press and hold to move">Hold</button>
          </div>
          <div class="camera-zoom-pair" role="group" aria-label="Zoom">
            <button id="cameraZoomOut" type="button" class="button-surface utility-btn camera-zoom">Zoom out</button>
            <button id="cameraZoomIn" type="button" class="button-surface utility-btn camera-zoom">Zoom in</button>
          </div>
        </div>
        <div class="camera-live-actions">
          <button id="cameraSnapBtn" data-track="camera.snapshot" type="button" class="button-surface utility-btn camera-action"><svg class="icon" aria-hidden="true"><use href="#i-camera"></use></svg>Screenshot</button>
          <button id="cameraRecBtn" data-track="camera.record" type="button" class="button-surface utility-btn camera-rec camera-action" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-video"></use></svg>Record</button>
        </div>
      </div>
      <!-- Saved position presets (issue #190). Hidden when the camera has no preset support. -->
      <div id="cameraPresetsRow" class="camera-presets" hidden>
        <span class="camera-controls-label">Presets</span>
        <div id="cameraPresetsList" class="camera-presets-list"></div>
        <button id="cameraPresetSave" type="button" class="button-surface utility-btn camera-preset-save">+ Save</button>
      </div>
      <!-- Manual coordinates (issue #190). Hidden unless the camera supports absolute moves. -->
      <div id="cameraCoordsRow" class="camera-coords" hidden>
        <span class="camera-controls-label">Position</span>
        <label class="camera-coord"><span>Pan</span><input id="cameraPanInput" type="number" step="0.01" class="input-native"></label>
        <label class="camera-coord"><span>Tilt</span><input id="cameraTiltInput" type="number" step="0.01" class="input-native"></label>
        <label class="camera-coord camera-coord-zoom"><span>Zoom</span><input id="cameraZoomInput" type="number" step="0.01" class="input-native"></label>
        <button id="cameraCoordsRefresh" type="button" class="icon-button" aria-label="Read current position"><svg class="icon" aria-hidden="true"><use href="#i-rotate-cw"></use></svg></button>
        <button id="cameraCoordsGo" type="button" class="button-surface utility-btn camera-coords-go">Go</button>
      </div>
    </div>
  </dialog>

  <!-- Snapshot zoom: the persisted last frame at full size (issue #190). -->
  <dialog id="cameraZoomDialog" class="detail-dialog camera-zoom-dialog">
    <div class="detail-card camera-zoom-card">
      <div class="detail-header">
        <h2 tabindex="-1" autofocus id="cameraZoomName">Camera</h2>
        <button id="cameraZoomClose" type="button" class="icon-button detail-close" aria-label="Close"><svg class="icon" aria-hidden="true"><use href="#i-x"></use></svg></button>
      </div>
      <img id="cameraZoomImg" class="camera-zoom-img" alt="Last camera snapshot">
    </div>
  </dialog>

  <!-- PTZ preset name prompt (issue #722): save/rename share this one styled
       dialog instead of a native window.prompt() — every other rename/create
       flow in the PWA already goes through a styled <dialog>, this was the
       one holdout. Title + initial value are set per-open in JS. -->
  <dialog id="cameraPresetNameDialog" class="detail-dialog">
    <div class="detail-card">
      <div class="detail-header">
        <h2 tabindex="-1" autofocus id="cameraPresetNameTitle">Preset name</h2>
        <button id="cameraPresetNameClose" type="button" class="icon-button detail-close" aria-label="Close"><svg class="icon" aria-hidden="true"><use href="#i-x"></use></svg></button>
      </div>

      <label class="row">
        <span>Name</span>
        <input id="cameraPresetNameInput" type="text" class="input-native" placeholder="Preset name…">
      </label>

      <div class="detail-actions">
        <button id="cameraPresetNameSave" type="button" class="button-primary detail-save-btn">Save</button>
      </div>
    </div>
  </dialog>
