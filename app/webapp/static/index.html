  <!-- Pre-paint boot (vendored text-size-boot.html, #820): stamps html[data-theme]
       from home-automation.theme and html[data-textsize] from
       home-automation.textsize before first paint. The `app` prefix is the one
       per-app edit. Keep it inline and before the stylesheets. -->
  <script>
    (function () {
      var app = 'home-automation';
      var root = document.documentElement;
      var theme = null;
      var size = null;
      try {
        theme = localStorage.getItem(app + '.theme');
        size = localStorage.getItem(app + '.textsize');
      } catch (e) {}
      var dark = theme ? theme === 'dark'
        : window.matchMedia('(prefers-color-scheme: dark)').matches;
      root.dataset.theme = dark ? 'dark' : 'light';
      root.dataset.textsize = size === 'small' || size === 'large' ? size : 'default';
    })();
  </script>

  <!-- Floating bottom-tab nav on mobile / installed PWA; a sticky top segmented
       control on desktop (issue #57). Deliberately a direct child of <body> and a
       sibling of the scrolling <main class="app">: iOS captures position:fixed
       descendants of momentum scrollers and anchors them to scrolled content, not
       the viewport. Keeping the nav outside the scroller is the load-bearing part
       of issue #232. Each tab carries a Lucide icon + label (issue #77); panes
       toggle with [hidden]; the chosen tab is remembered in localStorage.
       Five tabs (#779): Settings is no tab — every page header's gear opens
       its pane, the design.md five-destination ceiling. -->
  <nav class="tabs" role="tablist" aria-label="Sections" data-active-tab="home">
    <button id="tabHome" type="button" class="tab active" data-tab="home"
            role="tab" aria-selected="true" aria-controls="paneHome">
      <svg class="icon tab-icon" aria-hidden="true"><use href="#i-house"></use></svg>
      <span class="tab-label">Home</span>
    </button>
    <button id="tabAc" type="button" class="tab" data-tab="ac"
            role="tab" aria-selected="false" aria-controls="paneAc" tabindex="-1">
      <svg class="icon tab-icon" aria-hidden="true"><use href="#i-snowflake"></use></svg>
      <span class="tab-label">AC</span>
    </button>
    <button id="tabEnergy" type="button" class="tab" data-tab="energy"
            role="tab" aria-selected="false" aria-controls="paneEnergy" tabindex="-1">
      <svg class="icon tab-icon" aria-hidden="true"><use href="#i-zap"></use></svg>
      <span class="tab-label">Energy</span>
    </button>
    <button id="tabIot" type="button" class="tab" data-tab="iot"
            role="tab" aria-selected="false" aria-controls="paneIot" tabindex="-1">
      <svg class="icon tab-icon" aria-hidden="true"><use href="#i-plug-zap"></use></svg>
      <span class="tab-label">Devices</span>
    </button>
    <button id="tabSecurity" type="button" class="tab" data-tab="security"
            role="tab" aria-selected="false" aria-controls="paneSecurity" tabindex="-1">
      <svg class="icon tab-icon" aria-hidden="true"><use href="#i-shield-check"></use></svg>
      <span class="tab-label">Security</span>
    </button>
  </nav>

  <main class="app">
    <!-- Visually-hidden page title (issue #370): the app is a tabbed SPA with
         no visible page heading (the active tab label already conveys the
         section), but a heading hierarchy needs a single <h1> as its root so
         screen-reader users get a page-level landmark. -->
    <h1 class="visually-hidden">Home automation</h1>
