# .fleet.toml — this repo's card on the fleet architecture map.
# fleet-config's /system-map aggregates every repo's .fleet.toml. Keep current:
# update in the same PR as any material change (layer, port, role, one-line
# description, exposed services). Schema: fleet-config/architecture/README.md.
layer       = "working-web"
icon        = "🌡️"
port        = 8447
description = "Home automation: AC, solar, per-circuit energy, alarm, network health, Home Assistant."
chips       = ["FastAPI", "PWA", "MELCloud", "Modbus", "FusionSolar", "Athom", "Tuya", "HA", "Telegram"]
shape       = "webapp-tray"
# Root folders the webapp-tray preset does not list: Home Assistant loads the integration
# from custom_components/ by name, and spike/ holds the standalone Streamlit POC
# (spike/streamlit_app.py, launched by launch_app.bat). docs/layout.md gives the reasons.
extra_roots = ["custom_components", "spike"]

