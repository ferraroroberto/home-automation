# [static_ratchet] -- the scaffold's baseline-and-ratchet static analysis. The gate
# (scripts/verify-before-ship.ps1) runs scripts/static_ratchet.py, which fails on a
# duplicate block (jscpd via npx, Python and JS), an unused import/variable (ruff
# F401,F841) or a ruff bug (B) / security (S) finding (S113 strict) that is not in
# .static-ratchet-baseline.json. Needs Node and ruff in
# the gate's venv; a detector that cannot run exits 3, which fails the gate. Vendored
# copies are duplicates by design, so they are excluded. Procedure + limits:
# project-scaffolding docs/static-ratchet.md.
[static_ratchet]
enabled  = true
baseline = ".static-ratchet-baseline.json"
exclude  = ["**/_vendored/**"]

# [docs_ratchet] -- the scaffold's baseline-and-ratchet docs stage. The gate
# (scripts/verify-before-ship.ps1) runs scripts/docs_ratchet.py through
# scripts/docs_ratchet_gate.py, which fails when README.md passes its byte budget
# or README.md / docs/**/*.md gains a history marker (issue reference, dated or
# changelog heading) beyond .docs-ratchet-baseline.json. Whole tree, never
# path-routed; exit 3 (git or a doc unreadable) is NOT CONFIRMED and fails.
# Nothing is excluded: no docs/ folder holds generated or dated reports.
# Procedure + limits: project-scaffolding docs/docs-ratchet.md.
[docs_ratchet]
enabled  = true
baseline = ".docs-ratchet-baseline.json"

# [comment_ratchet] -- the scaffold's baseline-and-ratchet stage over product-code
# comments. The gate (scripts/verify-before-ship.ps1) runs scripts/comment_ratchet.py
# through scripts/comment_ratchet_gate.py, which fails when a file's count of
# #NNN issue-reference comments rises beyond .comment-ratchet-baseline.json.
# Whole tree, never path-routed; exit 3 (git unusable, or a file could not be
# scanned) is NOT CONFIRMED and fails. Procedure + limits:
# project-scaffolding docs/comment-ratchet.md.
[comment_ratchet]
enabled  = true
baseline = ".comment-ratchet-baseline.json"

# [structure_ratchet] -- the scaffold's baseline-and-ratchet layout stage. The gate
# (scripts/verify-before-ship.ps1) runs scripts/structure_ratchet.py through
# scripts/structure_ratchet_gate.py, which fails when a new file passes 1,000 lines, a
# new function 100 lines or a flat directory 40 modules, when a baselined offender
# grows past its size in .structure-ratchet-baseline.json, when a src module imports
# app, and when the root folders do not match `shape` plus `extra_roots`. Existing
# offenders are baselined at today's size, never excluded. Whole tree, never
# path-routed; exit 3 (git unusable, an unparseable file, an unknown shape) is NOT
# CONFIRMED and fails. Procedure + limits: project-scaffolding docs/structure-ratchet.md.
[structure_ratchet]
enabled  = true
baseline = ".structure-ratchet-baseline.json"

# [instruction_ratchet] -- the scaffold's baseline-and-ratchet stage over the agent
# instruction files (CLAUDE.md, AGENTS.md, .claude/rules, skills). The gate
# (scripts/verify-before-ship.ps1) runs scripts/instruction_ratchet.py through
# scripts/instruction_ratchet_gate.py, which fails when a file's count of a prompt-audit
# lint rule rises beyond .instruction-ratchet-baseline.json or a file passes its size cap.
# Whole tree, never path-routed; exit 3 (git or an instruction file unreadable, an
# unclosed fence) is NOT CONFIRMED and fails. Procedure + limits: project-scaffolding
# docs/instruction-ratchet.md.
[instruction_ratchet]
enabled  = true
baseline = ".instruction-ratchet-baseline.json"

# [doc_refs_ratchet] -- the scaffold's baseline-and-ratchet stage over documentation
# references. The gate (scripts/verify-before-ship.ps1) runs scripts/doc_refs_ratchet.py
# through scripts/doc_refs_ratchet_gate.py, which fails when README.md, CLAUDE.md or
# docs/**/*.md names a repo path, python -m module, relative link or loopback port that
# does not resolve and is not in .doc-refs-ratchet-baseline.json. Whole tree, never
# path-routed; exit 3 (git unusable, a doc not UTF-8, an unclosed fence) is NOT CONFIRMED
# and fails. Ports of the other services the docs name are allowed on purpose.
# Procedure + limits: project-scaffolding docs/doc-refs-ratchet.md.
[doc_refs_ratchet]
enabled    = true
baseline   = ".doc-refs-ratchet-baseline.json"
# Other services the docs name on purpose: the local LLM hub, its llama-server
# backend, the whisper server, the voice transcriber, the sibling grocery app and
# the Home Assistant host's break-glass SSH; src/server.py is the hub repo's file.
allow_refs = [":8000", ":8088", ":8090", ":8443", ":8502", ":22222", "src/server.py"]

# [dead_code_ratchet] -- the scaffold's baseline-and-ratchet stage over definitions
# nothing refers to. The gate (scripts/verify-before-ship.ps1) runs
# scripts/dead_code_ratchet.py through scripts/dead_code_ratchet_gate.py, which fails
# when a tracked Python file gains a function, class or method that no file in the
# tree names, beyond .dead-code-ratchet-baseline.json. Route handlers, tests and
# decorated hooks are entry points by default. Whole tree, never path-routed; exit 3
# (git unusable, a tracked .py file that does not parse) is NOT CONFIRMED and fails.
# Procedure + limits: project-scaffolding docs/dead-code-ratchet.md.
[dead_code_ratchet]
enabled  = true
baseline = ".dead-code-ratchet-baseline.json"
# Home Assistant calls the integration's setup hooks by name, from outside this tree.
# tests/e2e/_geometry.py is a verbatim copy of the fleet helper, so its unused chart-tick
# assertion stays in the file rather than forking it.
allow    = ["custom_components/**/*.py:async_setup*", "tests/e2e/_geometry.py:assert_chart_ticks"]

# [conventions_ratchet] -- the scaffold's baseline-and-ratchet stage over fleet
# conventions held as stdlib ast rules. The gate (scripts/verify-before-ship.ps1) runs
# scripts/conventions_ratchet.py through scripts/conventions_ratchet_gate.py, which fails
# when a file's hit count for an enabled rule rises beyond .conventions-ratchet-baseline.json.
# Whole tree, never path-routed; exit 3 (git unusable, a tracked .py file that cannot be
# read or parsed) is NOT CONFIRMED and fails. Rules, with the reason each fits this shape:
#   no-window         -- a Windows app: every subprocess spawn suppresses the console window.
#   logging-not-print -- library code under app/ and src/ logs; CLI modules print by design.
#   no-drive-path     -- no hardcoded drive-letter location in code.
#   secret-compare    -- src/secret_compare.py exists: every constant-time compare routes there.
# git-wrapper is off: the repo has no run_git wrapper to route git spawns through.
# Procedure + limits: project-scaffolding docs/conventions-ratchet.md.
[conventions_ratchet]
enabled        = true
baseline       = ".conventions-ratchet-baseline.json"
rules          = ["no-window", "logging-not-print", "no-drive-path", "secret-compare"]
secret_helpers = ["src/secret_compare.py"]

# [shot_baseline] -- the scaffold's screenshot baseline. tests/e2e/test_shot_baseline.py
# captures the home, AC, energy and security tabs (phone and desktop, light and dark,
# stubbed fixture data only) into tests/e2e/shots; the gate (scripts/verify-before-ship.ps1)
# then runs scripts/shot_baseline.py, which fails on a visible change against the committed
# PNGs and restores the tree. The baseline is this machine's rasteriser, so the gate skips
# the comparison on CI. Contract + re-baseline steps: project-scaffolding
# docs/playwright-ui-testing.md ("Screenshot baseline").
[shot_baseline]
enabled   = true
shots_dir = "tests/e2e/shots"
capture   = ["-m", "pytest", "tests/e2e/test_shot_baseline.py", "--browser", "chromium", "-q", "-p", "no:cacheprovider"]

# [history_marker_ratchet] -- repo-specific (not vendored) stage over decision-history
# narration in product-code comments/docstrings ("used to be duplicated", "Extracted
# verbatim from X", "This was a pure code move"). The gate (scripts/verify-before-ship.ps1)
# runs scripts/history_marker_ratchet.py through scripts/history_marker_ratchet_gate.py,
# which fails when a file's marker count rises beyond .history-marker-ratchet-baseline.json.
# comment_ratchet only counts #NNN references and skips docstrings, so this closes that gap
# (audit #1044). Whole tree, never path-routed; exit 3 (git unusable, a file unreadable) is
# NOT CONFIRMED and fails.
[history_marker_ratchet]
enabled  = true
baseline = ".history-marker-ratchet-baseline.json"

# /perf-review (fleet-config skills/perf-review): "ready" is the energy-flow tile
# visible (the first Home card that needs live data), not first contentful paint,
# which goes green on a painted shell before any card has data (#777). It must
# show on Home: the AC unit cards sit on another tab, so it never would there.
[perf.review]
ready_selector = "#homeEnergyFlow"

# /design-review (fleet-config skills/design-review). The app stamps html[data-theme]
# at load from home-automation.theme (else the OS scheme), so the e2e capture hook
# (tests/e2e/_surface.py) has to set that key too or its dark shots stay light (#977).
[design.review]
theme_storage_key = "home-automation.theme"

# The throwaway instance `measure --e2e` walks: the e2e autoboot's engines-off
# environment with credentials and the LAN sweep disabled, never the live tray on
# :8447 (scripts/design_review_synthetic.py).
[design.review.synthetic]
command = ["scripts/design_review_synthetic.py"]
startup_timeout_s = 60

# `measure --e2e` runs the suite with the surface() hook armed. --e2e-autoboot boots
# the suite's own disposable webapp even while the tray holds :8447, where a bare
# run would stop at the live-instance guard.
[design.review.e2e]
command = ["-m", "pytest", "tests/e2e", "--e2e-autoboot", "-q"]
timeout_s = 900

# Diff-proportionate e2e routing (ferraroroberto/home-automation#603,
# project-scaffolding#180, schema: project-scaffolding/docs/e2e-routing.md).
# Rules are evaluated top-to-bottom; FIRST MATCH WINS -- a narrow rule for a
# subtree must precede the broader rule for its enclosing prefix. Unmatched
# paths fail safe to "full" (scripts/classify_e2e.py); this table only ever
# narrows what an already-recognized-as-narrow diff runs, never what an
# unmatched one runs. Update in the same PR as any new e2e-relevant directory.
[e2e]
static_pytest_target = "tests/e2e/test_smoke.py"
static_browsers       = ["chromium"]
full_pytest_target    = "tests/e2e"
# The gate's per-test START/DONE/FAILED history (gitignored; written by
# scripts/verify-before-ship.ps1 via tests/_progress_log.py). Every gate run
# that reached the browser phase, from any checkout, is appended to the primary
# checkout's copy (last 20 kept). /e2e-audit reads it for where the browser
# leg's time goes and for its red history (home-automation#778, fleet-config#1018).
progress_log          = "webapp/verify-progress.log"

# Inert image/font/manifest assets under the static tree -> smoke is enough.
[[e2e.rule]]
tier       = "static"
prefix     = "app/webapp/static/"
extensions = ["svg", "png", "jpg", "jpeg", "gif", "ico", "webp", "woff", "woff2", "ttf", "webmanifest"]

# Vendored component READMEs are documentation the PWA never loads. They need
# their own rule: the app/webapp/ "full" rule below would take them before
# the repo-wide md -> none rule at the bottom is reached (home-automation#778).
[[e2e.rule]]
tier       = "none"
prefix     = "app/webapp/static/_vendored/"
extensions = ["md"]

# Vendored HTML fragments are pure markup; their .css/.js siblings are NOT
# covered here and fall through to "full" below (real nav/icon behaviour).
[[e2e.rule]]
tier       = "static"
prefix     = "app/webapp/static/_vendored/"
extensions = ["html"]

# The e2e suite itself, and its shared conftest/helpers -- a harness change
# must be exercised by running the harness (home-automation#593).
[[e2e.rule]]
tier   = "full"
prefix = "tests/e2e/"

# The whole FastAPI + PWA product: routers (the browser's API surface),
# middleware, server boot, the static tree, and the automation modules that
# feed state the UI renders (push notifications, activity log, presence).
# Deliberately not split narrower -- several automation modules here have no
# template of their own but do change what the UI shows, so a finer split
# would risk silently under-testing a real UI-affecting change.
[[e2e.rule]]
tier   = "full"
prefix = "app/webapp/"

# The Windows tray that owns the webapp lifecycle.
[[e2e.rule]]
tier   = "full"
prefix = "app/tray/"

# Device clients + domain logic with no UI template of their own -- no
# browser impact unless paired with an app/webapp/ change (which already
# routes full above on its own).
[[e2e.rule]]
tier       = "none"
prefix     = "src/"
extensions = ["py"]

# The Home Assistant integration is a thin API adapter with no browser UI.
[[e2e.rule]]
tier   = "none"
prefix = "custom_components/"

[[e2e.rule]]
tier   = "none"
prefix = "scripts/"

[[e2e.rule]]
tier   = "none"
prefix = "config/"

[[e2e.rule]]
tier   = "none"
prefix = "docs/"

# The throwaway Streamlit POC spike -- a separate manual :8501 launch, not
# exercised by tests/e2e at all.
[[e2e.rule]]
tier   = "none"
prefix = "spike/"

# Static icon/image assets (tray icon, Stream Deck art) -- not served by the
# webapp's PWA static tree, no browser impact.
[[e2e.rule]]
tier   = "none"
prefix = "assets/"

# Non-e2e tests (tests/e2e/ already matched full above).
[[e2e.rule]]
tier       = "none"
prefix     = "tests/"
extensions = ["py"]

# Repo meta / docs / launcher scripts -- no runtime behaviour of their own;
# the e2e fixture boots the app directly, not through these .bat/.sh wrappers.
[[e2e.rule]]
tier = "none"
path = ".fleet.toml"
[[e2e.rule]]
tier = "none"
path = ".gitignore"
[[e2e.rule]]
tier = "none"
path = ".static-ratchet-baseline.json"
[[e2e.rule]]
tier = "none"
path = ".docs-ratchet-baseline.json"
[[e2e.rule]]
tier = "none"
path = ".comment-ratchet-baseline.json"
[[e2e.rule]]
tier = "none"
path = ".structure-ratchet-baseline.json"
[[e2e.rule]]
tier = "none"
path = ".instruction-ratchet-baseline.json"
[[e2e.rule]]
tier = "none"
path = ".doc-refs-ratchet-baseline.json"
[[e2e.rule]]
tier = "none"
path = ".dead-code-ratchet-baseline.json"
[[e2e.rule]]
tier = "none"
path = ".conventions-ratchet-baseline.json"
# The .env template: documentation of the keys, never read at runtime (the
# app reads .env itself) -- unclassified, it failed safe to full (#778).
[[e2e.rule]]
tier = "none"
path = ".env.example"
[[e2e.rule]]
tier = "none"
path = "LICENSE"
[[e2e.rule]]
tier = "none"
path = "AGENTS.md"
[[e2e.rule]]
tier = "none"
path = "CLAUDE.md"
[[e2e.rule]]
tier       = "none"
extensions = ["md"]
[[e2e.rule]]
tier       = "none"
extensions = ["bat", "sh"]
