# Home Assistant custom sentences — Spanish web search (issues #321, #866).
#
# Install at the HA VM path: /config/custom_sentences/es/websearch.yaml
#
# The "Asistente (es)" pipeline (wake word "Hey Mycroft") runs the built-in
# deterministic conversation agent — no LLM fallback, by design (see
# docs/voice-control.md). Search-shaped questions matched here fire the
# WebSearch intent_script in configuration.snippet.yaml, which calls the app's
# POST /api/voice/search (SearXNG in Spanish + a local-hub summary) and speaks
# the returned sentence. The English "Okay Nabu" pipeline has its own
# web_search function and is unaffected.
#
# A bounded set of trigger phrasings, not a catch-all wildcard: a broad
# wildcard risks silently shadowing intents this file knows nothing about,
# now or in the future. Widen the phrase list here if a common phrasing is
# missed in practice.
language: "es"

lists:
  query:
    wildcard: true

intents:
  WebSearch:
    data:
      - sentences:
          - "busca [en internet] {query}"
          - "búscame {query}"
          - "búscame información (de|sobre) {query}"
          - "(qué|que) es {query}"
          - "(quién|quien) es {query}"
          - "(qué|que) noticias hay (de|sobre) {query}"
          - "cuánto cuesta {query}"
          - "cuánto vale {query}"
          - "(quién|quien) (ganó|gano) {query}"
          - "cuándo (es|fue|son) {query}"
          - "(cómo|como) (quedó|quedo|quedaron) {query}"
          - "(qué|que) tiempo hace en {query}"
          - "a cuánto (está|están|esta|estan) {query}"
          - "dime {query}"
