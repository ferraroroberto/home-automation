# Home Assistant custom sentences — calendar voice commands (issue #313).
#
# Install at the HA VM path: /config/custom_sentences/en/calendar.yaml
#
# Distinct from reminder.yaml/wake_alarm.yaml/alarm.yaml — every sentence
# here says "calendar" so it can never collide with those grammars.
# Create-only: writes a real Google Calendar event, not an app-local list
# (see src/calendar_write.py) — there is no cancel/list/edit intent here.
#
# {text} is a free-text wildcard capturing the whole spoken event
# description PLUS an optional trailing due-date/time cue ("dentist
# appointment to my calendar tomorrow at 3pm"). It has to swallow the whole
# tail — including the embedded "to/on my/the calendar" filler — because a
# single trailing wildcard can't be followed by more literal text once a
# date/time cue trails it; the app splits summary from date/time and strips
# the filler server-side (src/calendar_events.py:parse_spoken_calendar_event).
language: "en"

lists:
  text:
    wildcard: true

intents:
  CalendarAdd:
    data:
      - sentences:
          - "(add|create|new|schedule|put) [a] [new] [calendar] [event] {text}"
          - "add {text} to [my] [the] calendar"
          - "put {text} (on|in) [my] [the] calendar"
