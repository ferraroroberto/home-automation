  # ---------------------------------------------------------------- settings
  - id: settings.root
    area: settings
    title: Settings
    root: data-surface
    reach:
      - the gear in any page head
      - Export rate on the Energy tab
    holds:
      - Display, a Text size control
      - Notifications, Alarm and UPS power
      - Home & people, Home location, Places, Presence automation
      - Energy, PV system, Export compensation, Solar boost, Sun-position check
      - Voice, Search engine, What can I say?
      - Diagnostics, Activity log, a Record navigation log switch
    does:
      - Text size changes the type scale for this device only
      - a row opens its sheet
      - Record navigation log posts each navigation event to the server's log, for diagnosing a phone-only layout bug; it persists across launches
    why: Settings is a pane, not a tab, so the five tabs fit a bottom bar and the gear is one tap from everywhere
    links:
      - to: settings.notify-alarm-sheet
        via: Alarm
      - to: settings.notify-ups-sheet
        via: UPS power
      - to: settings.home-location-sheet
        via: Home location
      - to: settings.presence-places-sheet
        via: Places
      - to: settings.presence-automation-sheet
        via: Presence automation
      - to: energy.pv-system-sheet
        via: PV system
      - to: energy.export-rate-sheet
        via: Export compensation
      - to: energy.boost-coord-sheet
        via: Solar boost
      - to: energy.sun-overlay-sheet
        via: Sun-position check
      - to: settings.searxng-sheet
        via: Search engine
      - to: settings.voice-sheet
        via: What can I say?
      - to: shared.activity-dialog
        via: Activity log
  - id: settings.notify-alarm-sheet
    area: settings
    title: Alarm notifications
    root: data-surface
