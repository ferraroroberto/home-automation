  # ---------------------------------------------------------------- network
  - id: iot.network-sheet
    area: network
    title: Network sheet
    root: data-surface
    reach:
      - Internet in Devices › Network
      - Attached devices in Devices › Network, opened at that card
    holds:
      - the Internet block, a speed test result, Run speed test, a nightly speed test switch and trend sparklines
      - an Access point card and a Router card, each with a reboot button
      - the Wi-Fi diagnostics, Walk test, Attached devices and DHCP reservation plan cards
      - Done
    does:
      - Run speed test measures; the nightly switch runs it once around 03:00
      - Reboot AP and Reboot ask for confirmation
    states:
      - a card whose read fails says no data
    why: the nightly speed test is opt-in because it spends real bandwidth
    links:
      - to: iot.network-wifi-diagnostics
        via: Wi-Fi diagnostics
      - to: iot.network-walk-test
        via: Walk test
      - to: iot.network-attached-devices
        via: Attached devices
      - to: iot.network-dhcp-plan
        via: DHCP reservation plan
      - to: shared.confirm-dialog
        via: Reboot
  - id: iot.network-wifi-diagnostics
    area: network
    title: Wi-Fi diagnostics card
    root: data-surface
    reach:
      - the Wi-Fi diagnostics card in the network sheet
    holds:
      - the radios on 2.4 GHz and 5 GHz, with recommendations
      - Show hidden, with a count of the hidden radios
    does:
      - a radio opens its editor
    links:
      - to: iot.net-wifi-dialog
        via: a radio row
  - id: iot.network-walk-test
    area: network
    title: Walk test card
    root: data-surface
    reach:
      - the Walk test card in the network sheet
    holds:
      - an explanation that the phone is the probe and the access point is the meter
      - Pick device, Record here, a room field and the samples so far
    does:
      - Pick device chooses which device this is; Record here stores a sample for the room
    states:
      - no device picked says so and disables recording
    why: no browser exposes Wi-Fi scanning, so the access point measures a phone that walks the house
    links:
      - to: iot.net-survey-dialog
        via: Pick device
  - id: iot.network-attached-devices
    area: network
    title: Attached devices card
    root: data-surface
    reach:
      - the Attached devices card in the network sheet
      - Attached devices in Devices › Network
    holds:
      - device counts, an order switch (A-Z, Signal), Offline hidden, Show hidden, a group filter, My groups and a band filter
      - one row per device
    does:
      - a device row opens the device editor
      - My groups opens the group editor
    links:
      - to: iot.net-device-dialog
        via: a device row
      - to: iot.net-group-dialog
        via: My groups
  - id: iot.network-dhcp-plan
    area: network
    title: DHCP reservation plan card
    root: data-surface
    reach:
      - the DHCP reservation plan card in the network sheet
    holds:
      - a line on how many reservations the router holds
      - Refresh, warnings, the reservations on the router now, a Manual reservation form with Stage and Clear
      - Apply changes
    does:
      - opening computes the plan; ticks mark reservations to remove or add
      - Apply changes sends everything at once
    states:
      - before it opens it says *Open to compute the plan.*
    why: reservations are staged and applied together because a router changes its address table on every write
  - id: iot.net-device-dialog
    area: network
    title: Network device editor
    root: data-surface
    reach:
      - a device row in the Attached devices card
    holds:
      - "read-only: status, vendor, network address, connection, signal, Wi-Fi network, seen by, hostname, last seen"
      - Display name, Group with a New group field, Important, Hidden
    does:
      - Save stores the name, group and flags
  - id: iot.net-group-dialog
    area: network
    title: Network group editor
    root: data-surface
    reach:
      - My groups in the Attached devices card
    holds:
      - the devices in the group, a Name field
    does:
      - Save stores the group; Delete group removes it
  - id: iot.net-wifi-dialog
    area: network
    title: Wi-Fi radio sheet
    root: data-surface
    reach:
      - a radio row in the Wi-Fi diagnostics card
    holds:
      - "read-only: status, band, channel, signal, security"
      - Display name, Hidden
    does:
      - each change is applied as it is made; Done closes
  - id: iot.net-survey-dialog
    area: network
    title: Which device is this
    root: data-surface
    reach:
      - Pick device in the Walk test card
    holds:
      - the attached devices to choose from
