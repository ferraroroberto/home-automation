      - Save stores it; Delete override removes it
  # ---------------------------------------------------------------- cameras
  - id: security.camera-dialog
    area: cameras
    title: Camera sheet
    root: data-surface
    reach:
      - a camera row in Security › Cameras
    holds:
      - the last snapshot
      - read-only model
      - Display name
      - Open live view
    does:
      - Save stores the name
      - Open live view opens the live sheet
    states:
      - no snapshot shows *Snapshot unavailable*
    links:
      - to: security.camera-live-dialog
        via: Open live view
  - id: security.camera-live-dialog
    area: cameras
    title: Live view
    root: data-surface
    reach:
      - Open live view in the camera sheet
      - the video button on a camera row
    holds:
      - the live picture
      - a Step or Hold mode switch and a pan and tilt pad
      - Zoom out and Zoom in
      - Screenshot and Record
      - Presets, each with Go, rename and delete, and a Save button
      - Position, with Pan, Tilt and Zoom fields and Go
    does:
      - "the pad moves the camera: one fixed nudge in Step, held movement in Hold"
      - Save under Presets asks for a name
      - Go moves to a preset, rename opens the name sheet, delete asks before removing it
    states:
      - presets and Position appear only for a camera that supports them
    links:
      - to: security.camera-preset-name-dialog
        via: Save a preset
      - to: security.camera-hold-to-move
        via: the pad
  - id: security.camera-zoom-dialog
    area: cameras
    title: Camera zoom view
    root: data-surface
    reach:
      - the thumbnail on a camera row in Security › Cameras
    holds:
      - the camera's name and its last saved frame full size
    does:
      - closes with ×, Esc or the backdrop
    states:
      - a camera with no saved frame closes at once with a toast saying to open the camera to capture one
  - id: security.camera-preset-name-dialog
    area: cameras
    title: Preset name
    root: data-surface
    reach:
      - Save under Presets in the live view
      - rename on a preset
    holds:
      - a Name field
    does:
      - Save stores the current position under the name
    why: a styled sheet replaces the browser's prompt box, which an installed PWA renders badly
  - id: security.camera-hold-to-move
    area: cameras
    title: Hold to move the camera
    root:
      none: "a gesture on the live view's pad, not an element"
    reach:
      - pointer down on a pad arrow in Hold mode
    does:
      - the camera moves while the pointer is down and stops when it is released
    why: a held move is how a person aims a camera, and a fixed nudge is the safer mode when the connection lags
