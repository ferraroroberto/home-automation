  - id: settings.presence-automation-sheet
    area: presence
    title: Presence automation sheet
    root: data-surface
    reach:
      - Presence automation in Settings › Home & people
    holds:
      - Auto arm on departure, with Away minutes before arm and Stale after minutes
      - Auto disarm on arrival
      - Enable notifications
