    does:
      - choosing a device sets the probe and closes the sheet
  # ---------------------------------------------------------------- security
  - id: security.pane
    area: security
    title: Security
    root: data-surface
    reach:
      - the Security tab
      - an alarm chip on Home
    holds:
      - the head with a count of detectors as its live line
      - the alarm card, titled with the state (Not armed, Armed, Arming) and the next scheduled action
      - the arm control, Off, Partial, Perimeter, Full
      - Kids home and Don't arm when away, two switches
      - Detectors, with a filter, a Filters & sort button and Show all
      - Cameras
      - People, with an Accounts row and Show hidden
      - Recent events, the last three, with All events
      - Automations, the Schedules, Scene capture and Override rows
    does:
      - a mode button sets the alarm and the page redraws from the returned state
      - a detector row opens the detector sheet; a camera row opens the camera sheet, its thumbnail zooms the last frame and its trailing video button opens the live view; a person row opens the person sheet
      - Filters & sort opens the Detectors filters sheet
      - All events opens the activity log
      - each Automations row opens its sheet
    states:
      - the panel unreachable shows its own line instead of a stale mode
      - a group with nothing to list says so
    why: the arm control is the same component as Home's, so the alarm is set the same way from both places
    links:
      - to: security.zone-dialog
        via: a detector row
      - to: security.filters-sheet
        via: Filters & sort
      - to: security.camera-dialog
        via: a camera row
      - to: security.camera-zoom-dialog
        via: a camera thumbnail
      - to: security.camera-live-dialog
        via: a camera row's video button
      - to: security.presence-dialog
        via: a person row
      - to: security.presence-accounts-sheet
        via: Accounts
      - to: shared.activity-dialog
        via: All events
      - to: security.schedules-sheet
        via: Schedules
      - to: security.scene-pairings-sheet
        via: Scene capture
      - to: security.overrides-sheet
        via: Override
  - id: security.filters-sheet
    area: security
    title: Detectors filters sheet
    root: data-surface
    reach:
      - Filters & sort beside the detector filter in Security › Detectors
    holds:
      - Show hidden detectors, a switch, with how many are hidden
      - Clear and Done
    does:
      - the switch shows or hides the hidden detectors as it is flipped and is remembered on the device; Clear turns it off; Done closes
    states:
      - the button appears only while a detector is hidden, and shows 1 while hidden ones are listed
    why: showing hidden detectors is a filter of the list, so it sits in the sheet with a count rather than as a second control under the list
  - id: security.zone-dialog
    area: security
    title: Detector sheet
    root: data-surface
    reach:
      - a detector row
    holds:
      - "read-only: type, status, trouble"
      - Ignore trouble
      - Display name
      - Hidden
    does:
      - Save stores the name and the two flags
    why: the cloud API reports only a generic trouble flag per zone, so Ignore trouble silences a known-faulty one
  - id: security.schedules-sheet
    area: security
    title: Alarm schedules sheet
    root: data-surface
    reach:
      - Schedules in Security › Automations
    holds:
      - one row per schedule, Add schedule
      - a line saying it arms or disarms at the set time on the chosen days
    does:
      - a row and Add schedule open the schedule editor
    links:
      - to: security.schedule-dialog
        via: a schedule row or Add schedule
  - id: security.schedule-dialog
    area: security
    title: Alarm schedule editor
    root: data-surface
    reach:
      - Add schedule
      - a schedule row
    holds:
      - Enabled, Time, Action, Days
    does:
      - Save stores it; Delete schedule removes it
  - id: security.scene-pairings-sheet
    area: security
    title: Scene capture sheet
    root: data-surface
    reach:
      - Scene capture in Security › Automations
    holds:
      - one row per pairing, Add pairing
      - a line saying a paired detector that trips makes its camera take a picture for the AI to judge
    does:
      - a row and Add pairing open the pairing editor
    links:
      - to: security.scene-pairing-dialog
        via: a pairing row or Add pairing
  - id: security.scene-pairing-dialog
    area: security
    title: Scene pairing editor
    root: data-surface
    reach:
      - Add pairing
      - a pairing row
    holds:
      - Enabled, Detector, Camera, Position
    does:
      - Save stores it; Delete pairing removes it
  - id: security.overrides-sheet
    area: security
    title: Override sheet
    root: data-surface
    reach:
      - Override in Security › Automations
    holds:
      - one row per override, Add override
      - a line saying that after N triggers in one armed session the detector is bypassed until the next arm
    does:
      - a row and Add override open the override editor
    links:
      - to: security.override-dialog
        via: an override row or Add override
  - id: security.override-dialog
    area: security
    title: Override editor
    root: data-surface
    reach:
      - Add override
